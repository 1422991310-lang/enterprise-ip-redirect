# Deploy this file to /etc/nginx/conf.d/enterprise-redirect.conf.
# It must be included from the nginx "http" context.

geo $enterprise_allowed_ip {
    default 0;
    include /etc/nginx/conf.d/enterprise-allowlist.conf;
}

map $enterprise_allowed_ip $enterprise_redirect_target {
    1 https://a.example.com/internal-page;
    0 https://c.example.com/access-info;
}

log_format enterprise_redirect
    '$remote_addr - [$time_local] "$request" '
    'status=$status allowed=$enterprise_allowed_ip '
    'target="$enterprise_redirect_target" '
    'referer="$http_referer" ua="$http_user_agent"';

server {
    listen 80;
    server_name b.example.com;

    access_log /var/log/nginx/enterprise_redirect_access.log enterprise_redirect;
    return 308 https://b.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name b.example.com;

    ssl_certificate /etc/nginx/certs/b.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/b.example.com/privkey.pem;

    access_log /var/log/nginx/enterprise_redirect_access.log enterprise_redirect;
    error_log /var/log/nginx/enterprise_redirect_error.log warn;

    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;

    location = / {
        return 302 $enterprise_redirect_target;
    }

    location / {
        return 302 $enterprise_redirect_target;
    }
}
